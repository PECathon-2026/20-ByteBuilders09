<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ShoeKart - Secure Checkout</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .container { max-width: 650px; margin: 0 auto; background: #1e293b; border-radius: 12px; padding: 32px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h1 { color: #38bdf8; font-size: 24px; margin-top: 0; }
    .order-summary { background: #0f172a; border-radius: 8px; padding: 16px; margin-bottom: 24px; border: 1px solid #334155; }
    .row { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #94a3b8; margin-bottom: 6px; }
    input, select { width: 100%; box-sizing: border-box; padding: 10px 14px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #f8fafc; font-size: 14px; }
    input:focus { outline: none; border-color: #38bdf8; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 12px; }
    .btn-pay { width: 100%; background: #0284c7; color: white; border: none; padding: 14px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 16px; transition: background 0.2s; }
    .btn-pay:hover { background: #0369a1; }
    .badge { background: #0369a1; color: #e0f2fe; padding: 3px 8px; border-radius: 4px; font-size: 11px; }
    /* Hidden trap element to test DOM redaction (gateways that only read visible text will leak this) */
    .hidden-backup-card { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h1>ShoeKart Express Checkout</h1>
      <span class="badge">SSL 256-Bit Secure</span>
    </div>

    <div class="order-summary">
      <div class="row">
        <span>Nike Air Pegasus Turbo (Size 10)</span>
        <span>Rs. 2,499.00</span>
      </div>
      <div class="row" style="color: #94a3b8; font-size: 13px;">
        <span>Express Delivery</span>
        <span>FREE</span>
      </div>
      <div class="row" style="border-top: 1px solid #334155; padding-top: 8px; font-weight: bold; font-size: 16px;">
        <span>Total Payable:</span>
        <span style="color: #38bdf8;">Rs. 2,499.00</span>
      </div>
    </div>

    <form id="checkout-form" onsubmit="event.preventDefault(); alert('Order Placed Successfully!');">
      <div class="form-group">
        <label for="billing-name">Full Name</label>
        <input id="billing-name" name="name" type="text" autocomplete="name" value="Aarav Sharma" />
      </div>

      <div class="form-group">
        <label for="billing-address">Delivery Address</label>
        <input id="billing-address" name="address" type="text" autocomplete="street-address" value="Flat 402, Green Glen Layout, Bellandur, Bengaluru 560103" />
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label for="pan-input">PAN Number (Mandatory for > Rs 2k)</label>
          <input id="pan-input" name="pan" type="text" value="ABCPA1234D" />
        </div>
        <div class="form-group">
          <label for="aadhaar-input">Aadhaar (KYC Verification)</label>
          <input id="aadhaar-input" name="aadhaar" type="text" value="2341 5678 9012" />
        </div>
      </div>

      <div class="form-group">
        <label for="card-number">Card Number</label>
        <input id="card-number" name="cardnumber" type="text" autocomplete="cc-number" placeholder="4532 0150 1234 5678" value="4532 0150 1234 5678" />
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label for="card-exp">Expiry (MM/YY)</label>
          <input id="card-exp" name="exp" type="text" autocomplete="cc-exp" placeholder="08/29" value="08/29" />
        </div>
        <div class="form-group">
          <label for="card-cvv">CVV / Security Code</label>
          <input id="card-cvv" name="cvv" type="password" autocomplete="cc-csc" maxlength="4" placeholder="842" value="842" />
        </div>
      </div>

      <!-- Hidden Trap element for testing fail-closed egress and DOM scanning -->
      <div id="trap-backup-card" class="hidden-backup-card" data-backup-card="4000123456789010" aria-hidden="true">
        Backup Payment Account: 4000123456789010
      </div>

      <button id="pay-button" type="submit" class="btn-pay">Pay Rs. 2,499 Now</button>
    </form>
  </div>
</body>
</html>
