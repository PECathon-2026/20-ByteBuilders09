<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CloudPortal - Two-Factor Authentication</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0b132b; color: #f1f5f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .card { background: #1c2541; padding: 40px; border-radius: 16px; width: 100%; max-width: 440px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); border: 1px solid #3a506b; }
    h2 { margin-top: 0; color: #6fffe9; font-size: 24px; text-align: center; }
    p.sub { color: #94a3b8; font-size: 14px; text-align: center; margin-bottom: 28px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 6px; font-weight: 500; }
    input.text-field { width: 100%; box-sizing: border-box; padding: 12px; background: #0b132b; border: 1px solid #3a506b; border-radius: 8px; color: #fff; font-size: 15px; }
    .otp-container { display: flex; justify-content: space-between; gap: 8px; margin-top: 10px; }
    .otp-box { width: 50px; height: 54px; text-align: center; font-size: 22px; font-weight: bold; background: #0b132b; border: 2px solid #3a506b; border-radius: 8px; color: #6fffe9; }
    .otp-box:focus { border-color: #6fffe9; outline: none; }
    .btn-submit { width: 100%; background: #5bc0be; color: #0b132b; font-weight: bold; border: none; padding: 14px; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 24px; transition: 0.2s; }
    .btn-submit:hover { background: #6fffe9; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Secure Login</h2>
    <p class="sub">Verify your corporate account identity</p>

    <form id="login-form">
      <div class="form-group">
        <label for="login-email">Corporate Email</label>
        <input id="login-email" class="text-field" type="email" autocomplete="email" value="alex.vance@defense-systems.internal" />
      </div>

      <div class="form-group">
        <label for="login-password">Master Password</label>
        <input id="login-password" class="text-field" type="password" autocomplete="current-password" value="K9#m$P72xQv!90" />
      </div>

      <div class="form-group">
        <label>6-Digit Verification OTP (Split inputs)</label>
        <div class="otp-container" id="otp-group" data-full-otp="749201">
          <input id="otp-1" class="otp-box" type="text" maxlength="1" value="7" autocomplete="one-time-code" />
          <input id="otp-2" class="otp-box" type="text" maxlength="1" value="4" />
          <input id="otp-3" class="otp-box" type="text" maxlength="1" value="9" />
          <input id="otp-4" class="otp-box" type="text" maxlength="1" value="2" />
          <input id="otp-5" class="otp-box" type="text" maxlength="1" value="0" />
          <input id="otp-6" class="otp-box" type="text" maxlength="1" value="1" />
        </div>
      </div>

      <button id="btn-login" class="btn-submit" type="button">Verify & Sign In</button>
    </form>
  </div>
</body>
</html>
